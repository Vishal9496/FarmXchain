# ============================================================================
# P0-2 JWT CONFIGURATION
# Append to backend/src/main/resources/application.properties
# ============================================================================

# Base64-encoded HMAC signing key. NO DEFAULT VALUE — this is deliberate.
# If JWT_SECRET is absent the application refuses to start with
#   "Could not resolve placeholder 'JWT_SECRET'"
# which is far safer than silently falling back to a weak or shared key.
# Generate with:  openssl rand -base64 64
jwt.secret=${JWT_SECRET}

# Access-token lifetime in milliseconds.
#   900000   =    15 minutes  (production default, per P0-2)
#   3600000  =     1 hour     (suggested for a live demo — see note below)
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# Written into the `iss` claim and required on every parse.
jwt.issuer=${JWT_ISSUER:farmxchain-auth}

# Written into the `aud` claim and required on every parse.
jwt.audience=${JWT_AUDIENCE:farmxchain-web}

# Tolerance for clock drift when checking `exp` and `iat`, in seconds.
jwt.clock-skew-seconds=${JWT_CLOCK_SKEW_SECONDS:60}
